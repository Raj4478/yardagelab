name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: npm install --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: npm install --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    env:
      VERCEL_ENV: production
      NEXT_PUBLIC_ALLOW_INDEX: 'true'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      AUDIT_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: npm install --legacy-peer-deps
      - name: Build production site
        run: npm run build
      - name: Start production site
        run: |
          npm start > /tmp/yardagelab.log 2>&1 &
          echo $! > /tmp/yardagelab.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/yardagelab.log
          exit 1
      - run: npm run healthcheck
      - run: npm run audit:site
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: seo-audit
          path: reports/seo-audit.json
          if-no-files-found: ignore
